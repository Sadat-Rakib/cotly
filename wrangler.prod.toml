# Production deploy config. Identical to wrangler.toml but WITHOUT the R2 binding:
# R2 is not yet enabled on this account (code is null-safe; enable R2, then create
# the bucket and copy the [[r2_buckets]] block back here to unlock media uploads).
# Tests and local dev use wrangler.toml, which keeps the binding for miniflare.
name = "cotly"
main = "src/index.ts"
compatibility_date = "2025-04-01"
workers_dev = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cotly-db"
database_id = "e68507d1-845a-4ce1-bf18-2c991b12ad0a"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
APP_URL = "https://cotly.cotly-app.workers.dev"
ALLOW_REGISTRATION = "false"
MOCK_SOCIAL_ENABLED = "true"
MEDIA_RETENTION_HOURS = "48"
# X is pay-per-post; publishing is enabled but hard-capped per month.
X_API_ENABLED = "true"
X_MAX_MONTHLY_SPEND_USD = "5"
