<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Cotly</title>
    <script>
      // Apply saved theme before first paint.
      try {
        if (localStorage.getItem('cotly_theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
